# Model catalog for the local gateway. Adding a model = adding a [backends.<name>] table; no code.
# Paths are resolved relative to this file. Memory is in GB, TTLs in seconds (0 = never passivate).

[gateway]
host = "127.0.0.1"
port = 8090                  # the gateway; not 8080 (that stays free for a plain mlx_lm.server if you want one)
backend_port_base = 18101    # backends get 18101, 18102, ... in catalog order
memory_budget_gb = 28        # resident backends may not exceed this (macOS, JVM, sbt need the rest)
default_llm = "qwen3-coder"

# Memory policy (defaults shown). The budget uses each backend's declared est_mem_gb, because Metal memory is invisible to
# per-process RSS. Starting a backend that would not fit evicts idle backends, least recently used first; busy and pinned
# backends are never evicted (a start waits up to room_timeout_s for room, then fails with 503 insufficient_memory).
# The pressure monitor is the reality check: if macOS reports low free memory or swap growing while backends are idle, the
# least recently used idle backend is evicted even though the budget says it fits.
# room_timeout_s      = 20
# pressure_eviction   = true
# pressure_interval_s = 5     # sample interval
# pressure_window_s   = 30    # swap growth is measured over this window
# swap_growth_gb      = 1.0   # evict if swap grew by this much within the window
# min_free_pct        = 12    # evict if free memory (kern.memorystatus_level) falls below this; 0 disables

# --- built-in adapters -------------------------------------------------------------------------------
#   mlx_lm       any mlx-community model, served by `mlx_lm.server` (OpenAI-compatible)      needs: python, model
#   jevstyle     a Jev-Style decision model in MLX format                                    needs: python, model_dir  [precision]
#   openjev_nli  an OpenJev NLI cross-encoder checkpoint                                     needs: python, root, subfolder
#   mlx_vlm      a vision-language model on mlx-vlm (images in, text out)                   needs: python, model  [image_tokens] [max_tokens]
#   search       hybrid retrieval backend (embedder + reranker + the index)                  needs: python, index_dir  [db]
#   command      anything else that speaks HTTP on a port; "{port}" is substituted           needs: command  [health] [kind]

[backends.qwen3-coder]
adapter = "mlx_lm"
description = "Code-tuned mixture-of-experts model (30B, 3B active). About 108 tok/s, no thinking mode. Its KV cache is large (96 KiB per token), so long contexts are costly: best for code-focused work at short context."
python = "/opt/homebrew/opt/mlx-lm/libexec/bin/python"
model = "mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit"
est_mem_gb = 17.5
ttl_s = 600

[backends.openjev-4b]
adapter = "openjev_nli"
description = "Natural-language-inference model: given a source text and a claim, says entailed, contradicted or neutral. Not a chat model. A weak signal; use it as a gate."
python = ".venv-jev/bin/python"
root = "models/openjev"
subfolder = "qwen3.5-4b-nli-v5"
est_mem_gb = 9.5
ttl_s = 300

[backends.jevstyle-2b]
adapter = "jevstyle"
description = "Decision model: scores a closed list of options (classify, route, tag, rate) in one pass, about 1 s, without generating text. Not a chat model."
python = ".venv-mlxjev/bin/python"
model_dir = "models/jevstyle-2b-mlx"
precision = "8bit"
est_mem_gb = 3
ttl_s = 900

# --- added 2026-10-04 after a head-to-head (bench_llm_compare.py; see docs/MODEL_GUIDE.md) -------------------------------
# Both are MoE models, verified against Hugging Face and mlx-lm 0.32. Memory is given as parts, generated by
# `python -m gateway.cli discover --snippet <id>`: weights + KV cache for ~32K tokens + 1 GB overhead (measured peaks: 21.5 and
# 16.0 GB at ~6k context). KV is small for both (about 20 KiB per token, hybrid attention); Qwen3-Coder's is 96 KiB per token.
#
# THINKING: under mlx-lm BOTH models think by default (verified live): a client that does not say otherwise gets reasoning in a
# separate field and, if max_tokens runs out first, an empty answer. So the server is started with thinking OFF by default
# (--chat-template-args), a request can still turn it on (chat_template_kwargs {"enable_thinking": true}), and the `*-think`
# profiles below do that with a token cap so a runaway stops.

[backends.qwen3-6-35b-a3b]            # qwen3_5_moe, 20.4 GB weights at 4-bit; KV about 0.7 GB at 32768 tokens (fp16)
adapter = "mlx_lm"
description = "General mixture-of-experts model (35B, 3B active). About 104 tok/s, passed 5 of 6 benchmark tasks. Thinking is off by default (use the think profile for reasoning). Small KV cache, so good for long contexts."
python = "/opt/homebrew/opt/mlx-lm/libexec/bin/python"
model = "mlx-community/Qwen3.6-35B-A3B-4bit"
aliases = ["qwen3.6", "qwen36"]
weights_gb = 20.4
kv_gb = 0.7
overhead_gb = 1.0
context_tokens = 32768
ttl_s = 600
args = ["--chat-template-args", '{"enable_thinking": false}']

[backends.gemma-4-26b-a4b]            # gemma4, 15.6 GB weights at 4-bit; KV about 0.9 GB at 32768 tokens (fp16)
adapter = "mlx_lm"
description = "General mixture-of-experts model (26B, 4B active). About 85 tok/s but the most reliable in the benchmark (6 of 6) and the smallest in memory. Thinking is off by default. Small KV cache, so good for long contexts."
python = "/opt/homebrew/opt/mlx-lm/libexec/bin/python"
model = "lmstudio-community/gemma-4-26B-A4B-it-QAT-MLX-4bit"
aliases = ["gemma4", "gemma"]
weights_gb = 15.7
kv_gb = 0.9
overhead_gb = 1.0
context_tokens = 32768
ttl_s = 600
args = ["--chat-template-args", '{"enable_thinking": false}']

# --- profiles: named virtual models on a backend, with request defaults (client values always win) -------------------------
# No second process: the same running backend serves both. Use model = "qwen3-6-think" etc.

[profiles.qwen3-6-think]
backend = "qwen3-6-35b-a3b"
description = "Qwen3.6 with thinking on, token-capped so a runaway stops"
aliases = ["qwen-think"]
[profiles.qwen3-6-think.defaults]
max_tokens = 4096
temperature = 0.6
chat_template_kwargs = { enable_thinking = true }

[profiles.gemma-4-think]
backend = "gemma-4-26b-a4b"
description = "Gemma 4 with thinking on, token-capped so a runaway stops"
aliases = ["gemma-think"]
[profiles.gemma-4-think.defaults]
max_tokens = 4096
temperature = 0.6
chat_template_kwargs = { enable_thinking = true }

# Not candidates on this machine: DeepSeek-V4-Flash is 151.5 GB at 4-bit (a thread called it "smallish"); Qwen3.8-27B and
# Qwen3.6-27B are dense (16.1 GB at 4-bit, reported 8-12 tok/s, long thinking).

# --- speech (phase 9) -------------------------------------------------------------------------------------------------------
# One venv for all speech models (.venv-audio: mlx-audio, python 3.13). Clips are written to data/audio (output_dir) and named
# reference voices for cloning live in data/voices (refs_dir); both can be overridden per backend. See PLAN.md "Speech".

[backends.kokoro]
adapter = "mlx_audio_tts"
description = "Narration voice (Kokoro, 82M): fast and clean English with many preset voices, no cloning. About 30x faster than real time, so a minute of audio takes a couple of seconds."
python = ".venv-audio/bin/python"
model = "mlx-community/Kokoro-82M-bf16"
voice = "af_heart"
voices = ["af_heart", "af_bella", "af_nicole", "af_sarah", "af_sky", "af_nova", "af_aoede", "af_kore", "af_alloy", "af_jessica", "af_river",
          "am_adam", "am_michael", "am_eric", "am_liam", "am_onyx", "am_puck", "am_fenrir", "am_echo",
          "bf_emma", "bf_isabella", "bf_alice", "bf_lily", "bm_george", "bm_daniel", "bm_lewis", "bm_fable"]
est_mem_gb = 2.5
ttl_s = 900
aliases = ["tts"]

[backends.whisper]
adapter = "mlx_audio_stt"
description = "Speech to text (Whisper large-v3-turbo) with word timestamps, for captions and for checking that a generated clip says what it should."
python = ".venv-audio/bin/python"
model = "mlx-community/whisper-large-v3-turbo-asr-fp16"
est_mem_gb = 3
ttl_s = 300
aliases = ["stt"]

# Qwen3-TTS comes in three flavours, all Apache 2.0, one catalog entry each (each is ~3 GB at 8-bit):
#   qwen3-tts-design  describe a voice in words (`instruct`); every call draws a NEW voice, so keep one with `save_as_voice`
#   qwen3-tts-clone   clone a voice from a short reference clip (`ref_audio` = a clip in data/voices, ideally 5-15 s, with its transcript)
# The usual workflow: design a narrator once with save_as_voice="narrator", then narrate every scene with the clone model.

[backends.qwen3-tts-design]
adapter = "mlx_audio_tts"
description = "Voice design (Qwen3-TTS 1.7B): describe the narrator in words (age, tone, pace) and get that voice. A new voice on every call, so save a good one as a named reference and narrate with qwen3-tts-clone."
python = ".venv-audio/bin/python"
model = "mlx-community/Qwen3-TTS-12Hz-1.7B-VoiceDesign-8bit"
lang_code = "english"
est_mem_gb = 4.5
ttl_s = 600
max_chars = 220

[backends.qwen3-tts-clone]
adapter = "mlx_audio_tts"
description = "Voice cloning (Qwen3-TTS 1.7B): speaks in the voice of a short reference clip kept in data/voices. Consistent across scenes, so this is the narrator model once a voice has been chosen."
python = ".venv-audio/bin/python"
model = "mlx-community/Qwen3-TTS-12Hz-1.7B-Base-8bit"
lang_code = "english"
ref_audio = "narrator"            # default reference clip: data/voices/narrator.wav (+ narrator.txt)
est_mem_gb = 4.5
ttl_s = 600
max_chars = 220
aliases = ["clone"]

# --- continuation scoring (phase 7) ---------------------------------------------------------------------------------------
# log P(candidate | prompt) for a closed list of candidates, no generation (POST /api/score). The emoji book's LLM worker uses
# it instead of loading its own copy of the model. Same weights as qwen3-coder but a separate process (mlx_lm.server cannot
# score continuations), so both count against the budget and an idle one is evicted to make room for the other.

[backends.qwen3-coder-score]
adapter = "mlx_lm_score"
description = "Qwen3-Coder as a scorer: log-probability of each candidate continuation after a prompt, in one batched pass. Not a chat model."
python = "/opt/homebrew/opt/mlx-lm/libexec/bin/python"
model = "mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit"
est_mem_gb = 18
ttl_s = 300

# --- vision (phase 10) ------------------------------------------------------------------------------------------------------
# The Gemma 4 and Qwen3.6 checkpoints above already contain their vision towers (mlx_lm ignores them); mlx-vlm serves the same
# files with images, so nothing new is downloaded. A second process means a second copy of the weights: with the text backend
# idle, starting the vision one evicts it (as with qwen3-coder-score). One venv: .venv-vlm (mlx-vlm, pypdfium2, python 3.13).
# Memory: measured peaks 17.0 GB (Gemma, 1120 image tokens) and 21.5 GB (Qwen3.6) on 1080p stills. See PLAN.md "Vision".

[backends.gemma-4-vision]
adapter = "mlx_vlm"
description = "Gemma 4 26B reading images: layout checks of film stills and screenshots, tables and figures in PDFs. The default vision model: in the spike it found more layout defects than Qwen3.6 at full resolution (see PLAN.md)."
python = ".venv-vlm/bin/python"
model = "lmstudio-community/gemma-4-26B-A4B-it-QAT-MLX-4bit"
aliases = ["vision", "gemma-vision"]
image_tokens = 1120         # 70..1120 per image; 1120 keeps 1080p small print legible
est_mem_gb = 18
ttl_s = 600

[backends.qwen3-6-vision]
adapter = "mlx_vlm"
description = "Qwen3.6 35B reading images. A second opinion: in the spike it caught different layout defects than Gemma."
python = ".venv-vlm/bin/python"
model = "mlx-community/Qwen3.6-35B-A3B-4bit"
aliases = ["qwen-vision"]
est_mem_gb = 23
ttl_s = 600

# --- search (phase 11): hybrid retrieval over the Scala compiler / build sources --------------------------------------------------
# Qwen3-Embedding-0.6B and Qwen3-Reranker-0.6B in one process (torch on MPS, .venv-jev), plus the index built by
# pipelines/search (sync.py, embed.py; see its README). The backend reads the index and never writes it.

[backends.scala-search]
adapter = "search"
description = "Search over scala/scala, the Scala 3 docs and scala/bug: BM25 plus Qwen3-Embedding vectors, reranked by Qwen3-Reranker. Returns passages with links, not answers."
python = ".venv-jev/bin/python"
index_dir = "pipelines/search"
aliases = ["search", "scala-search"]
est_mem_gb = 4
start_timeout_s = 240
ttl_s = 900
