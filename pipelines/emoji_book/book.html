<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emoji Book</title>
<style>
  :root {
    --desk: #d9d2c3; --paper: #fbf6ea; --ink: #2a241b; --muted: #8a7f6c; --line: #e6dcc6;
    --accent: #2a78d6; --look: rgba(42,120,214,.10); --now: rgba(235,104,52,.22); --hover: rgba(42,120,214,.16);
    --pop-bg: #fffdf7; --shadow: 0 8px 30px rgba(60,40,10,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      --desk: #121110; --paper: #1d1b18; --ink: #e8e1d2; --muted: #8f8776; --line: #33302a;
      --accent: #3987e5; --look: rgba(57,135,229,.14); --now: rgba(217,89,38,.30); --hover: rgba(57,135,229,.22);
      --pop-bg: #262420; --shadow: 0 8px 30px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --desk: #121110; --paper: #1d1b18; --ink: #e8e1d2; --muted: #8f8776; --line: #33302a;
    --accent: #3987e5; --look: rgba(57,135,229,.14); --now: rgba(217,89,38,.30); --hover: rgba(57,135,229,.22);
    --pop-bg: #262420; --shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--desk); color: var(--ink); font: 14px/1.5 system-ui, sans-serif; }
  .top { max-width: 820px; margin: 0 auto; padding: 14px 16px 8px; display: flex; gap: 18px; flex-wrap: wrap; align-items: baseline; }
  .top h1 { font-size: 15px; margin: 0; }
  .top .st { color: var(--muted); font-variant-numeric: tabular-nums; }
  .top .st b { color: var(--ink); font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.run { background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .page { max-width: 820px; margin: 4px auto 40px; background: var(--paper); border: 1px solid var(--line);
          border-radius: 4px; box-shadow: var(--shadow); padding: 34px 54px 26px; }
  @media (max-width: 700px) { .page { padding: 22px 18px; } }
  .text { font: 19px/2.9 Georgia, "Iowan Old Style", "Times New Roman", serif; text-align: left; hyphens: manual; }
  .text p { margin: 0 0 .2em; text-indent: 1.6em; } .text p.first { text-indent: 0; }
  .ph { position: relative; border-radius: 4px; cursor: default; }
  ruby { ruby-position: over; ruby-align: center; }
  rt { font: 15px/1 "Apple Color Emoji", "Segoe UI Emoji", sans-serif; letter-spacing: 1px; user-select: none; }
  rt.none { color: var(--muted); font-size: 12px; opacity: .5; }
  .ph:hover { background: var(--hover); }
  .w.look { background: var(--look); }
  .ph.tbg { background: color-mix(in srgb, var(--tint) 34%, transparent); }
  .ph.ttxt .w { color: color-mix(in srgb, var(--tint) 72%, var(--ink)); font-weight: 600; }
  .ctl { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; max-width: 820px; margin: 0 auto; padding: 0 16px 6px; color: var(--muted); font-size: 12px; }
  .ctl select, .ctl input[type=range] { font: inherit; accent-color: var(--accent); }
  .ctl select { background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 1px 4px; }
  .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .w.now { background: var(--now); border-radius: 3px; }
  .foot { display: flex; justify-content: space-between; color: var(--muted); font: 12px Georgia, serif; margin-top: 14px; border-top: 1px solid var(--line); padding-top: 8px; }
  #pop { position: fixed; z-index: 5; display: none; background: var(--pop-bg); border: 1px solid var(--line); border-radius: 8px;
         box-shadow: var(--shadow); padding: 10px 12px; width: 300px; font: 12px/1.4 system-ui, sans-serif; pointer-events: none; }
  #pop h4 { margin: 0 0 6px; font-weight: 600; font-size: 12px; }
  #pop .r { display: grid; grid-template-columns: 22px 1fr 40px; gap: 6px; align-items: center; margin: 2px 0; }
  #pop .r .b { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  #pop .r .b i { display: block; height: 100%; background: var(--accent); }
  #pop .r span.p { text-align: right; font-variant-numeric: tabular-nums; }
  #pop .seg { color: var(--muted); margin-top: 6px; }
  .empty { color: var(--muted); text-align: center; padding: 80px 0; font: 16px Georgia, serif; }
</style>
</head>
<body>
<div class="top">
  <h1>Alice, in emoji <span style="font-weight:400;color:var(--muted)">· spaCy chunks phrases, a local Jev-style model picks the emoji</span></h1>
  <span class="st"><span class="dot" id="dot"></span><b id="stage">…</b></span>
  <span class="st">phrase <b id="ph">0</b> · word <b id="wd">0</b>/<span id="tw">0</span></span>
  <span class="st"><b id="spp">–</b> s/phrase · vocab <b id="voc">–</b> · <span id="mdl"></span></span>
</div>

<div class="ctl">
  <label><input type="checkbox" id="tint" checked> colour the text by its vibe colour when the model is confident</label>
  <label>style <select id="tintmode"><option value="bg">highlight</option><option value="text">text colour</option></select></label>
  <label>confidence &ge; <input type="range" id="conf" min="0.15" max="0.9" step="0.05" value="0.40"> <b id="confv" style="color:var(--ink)">0.40</b></label>
</div>
<div class="page"><div class="text" id="text"><div class="empty">loading the book…</div></div>
  <div class="foot"><span id="chap">Alice’s Adventures in Wonderland</span><span id="pg"></span></div></div>
<div id="pop"></div>

<script>
const $ = id => document.getElementById(id);
const PAGE_WORDS = 230, WINDOW = 32;
let words = null, events = [], status = null, lastPage = -1, byWord = null;
const COLORS = { red: "#e34948", orange: "#eb6834", yellow: "#d9a300", green: "#2e9e4f", blue: "#2a78d6", purple: "#7a5ad6",
                 pink: "#e87ba4", brown: "#8a5a2e", black: "#555555", white: "#b8b4a8", grey: "#8a8a8a", gold: "#c9a227" };
const NOCOLOR = "no particular colour";
const confThr = () => parseFloat($("conf").value);
const tintOf = ev => {                       // colour of this phrase if the model is confident, else null
  const c = ev.attrs && ev.attrs.color;
  return (c && $("tint").checked && c.top !== NOCOLOR && c.p >= confThr() && COLORS[c.top]) || null;
};

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function render() {
  if (!words) return;
  const cursor = events.length ? events[events.length - 1].w1 : 0;
  const page = Math.floor(cursor / PAGE_WORDS);
  const a = page * PAGE_WORDS, b = Math.min(words.length, a + PAGE_WORDS);
  const staged = status && status.state === "running" && status.stage !== "idle";
  const lookEnd = cursor + WINDOW;

  // phrase lookup for words in this page
  const phrases = events.filter(e => e.w1 > a && e.w0 < b);
  let html = "", wi = a, para = [], pi = 0, open = false;
  const flushPara = first => { if (para.length) { html += `<p class="${first ? "first" : ""}">${para.join(" ")}</p>`; para = []; } };
  let firstInPage = true, sawPara = false;
  // split by paragraphs, annotate phrases (a phrase never spans pages beyond a boundary issue; clip to page)
  const out = [];
  while (wi < b) {
    const ph = phrases.find(e => e.w0 === wi);
    const end = ph ? Math.min(ph.w1, b) : wi + 1;
    const startsPara = words[wi].p === 1 && wi !== a;
    if (startsPara) { flushPara(firstInPage); firstInPage = false; }
    if (ph) {
      const inner = [];
      for (let j = wi; j < end; j++) inner.push(`<span class="w">${esc(words[j].w)}</span>`);
      const emo = ph.top.length ? ph.top.map(t => t.e).join("") : `<span style="opacity:.5">·</span>`;
      const tc = tintOf(ph);
      const tcls = tc ? (" " + ($("tintmode").value === "text" ? "ttxt" : "tbg")) : "";
      para.push(`<ruby class="ph${tcls}" data-i="${ph.i}"${tc ? ` style="--tint:${tc}"` : ""}>${inner.join(" ")}<rt${ph.top.length ? "" : ' class="none"'}>${emo}</rt></ruby>`);
      wi = end;
    } else {
      const cls = wi >= cursor && wi < cursor + (staged ? WINDOW : 0) ? "w look" : "w";
      const nowCls = (wi >= cursor && wi < cursor + 1 && staged) ? " now" : "";
      para.push(`<span class="${cls}${nowCls}">${esc(words[wi].w)}</span>`);
      wi++;
    }
  }
  flushPara(firstInPage);
  $("text").innerHTML = html;
  $("pg").textContent = `page ${page + 1} of ${Math.ceil(words.length / PAGE_WORDS)}`;
  lastPage = page;
}

function renderStatus() {
  if (!status) return;
  $("stage").textContent = status.state === "finished" ? "finished" : status.stage || status.state;
  $("dot").className = "dot" + (status.state === "running" && status.stage !== "idle" ? " run" : "");
  $("ph").textContent = status.phrases; $("wd").textContent = status.cursor; $("tw").textContent = status.total_words;
  $("voc").textContent = status.vocab; $("mdl").textContent = (status.model || "").replace("qwen3.5-", "").replace("-nli", "") + (status.device ? " · " + status.device : "");
  const tot = events.reduce((s, e) => s + e.secs_seg + e.secs_emoji, 0);
  $("spp").textContent = events.length ? (tot / events.length).toFixed(1) : "–";
}

async function poll() {
  try {
    if (!words) words = await (await fetch("/data/book_words.json")).json();
    const [s, e] = await Promise.all([fetch("/data/book_status.json", { cache: "no-store" }), fetch("/data/book_events.jsonl", { cache: "no-store" })]);
    if (s.ok) status = await s.json();
    if (e.ok) events = (await e.text()).split("\n").filter(Boolean).map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
    render(); renderStatus();
  } catch (err) { }
  setTimeout(poll, 700);
}

// hover popup
const pop = $("pop");
document.addEventListener("mousemove", e => {
  const ph = e.target.closest && e.target.closest("ruby.ph");
  if (!ph) { pop.style.display = "none"; return; }
  const ev = events[+ph.dataset.i]; if (!ev) return;
  const rows = ev.alts.map(a => `<div class="r"><span>${a.e}</span><div class="b"><i style="width:${(a.p * 100).toFixed(0)}%"></i></div><span class="p">${(a.p * 100).toFixed(0)}%</span></div><div style="grid-column:1/-1;color:var(--muted);margin:-2px 0 2px 28px">${esc(a.name)} · z ${a.z.toFixed(1)}</div>`).join("");
  const segRows = ev.seg.cands.map((c, i) => `${c}:${(ev.seg.p[i] * 100).toFixed(0)}%`).join("  ");
  const segInfo = ev.seg.cands.length
    ? `phrase length → P(complete phrase)<br>${segRows}<br>chose <b>${ev.seg.chosen}</b> words · ${ev.secs_seg}s seg + ${ev.secs_emoji}s emoji`
    : `${ev.seg.chosen} words (spaCy chunker) · ${ev.secs_emoji}s to score all emoji`;
  const A = ev.attrs || {};
  const attrRows = [];
  if (A.color) attrRows.push(`<div>colour: ${COLORS[A.color.top] ? `<span class="sw" style="background:${COLORS[A.color.top]}"></span>` : ""}<b>${esc(A.color.top)}</b> ${(A.color.p * 100).toFixed(0)}%</div>`);
  if (A.mood) attrRows.push(`<div>mood: <b>${esc(A.mood.top)}</b> ${(A.mood.p * 100).toFixed(0)}%</div>`);
  if (A.sentiment) attrRows.push(`<div>sentiment: <b>${A.sentiment.score > 0 ? "+" : ""}${A.sentiment.score.toFixed(2)}</b> (−2 … +2)</div>`);
  const attrHtml = attrRows.length ? `<div class="seg" style="color:var(--ink)">${attrRows.join("")}</div>` : "";
  pop.innerHTML = `<h4>“${esc(ev.text)}”</h4>${rows}${attrHtml}<div class="seg">${segInfo}</div>`;
  pop.style.display = "block";
  const x = Math.min(window.innerWidth - 320, e.clientX + 14), y = Math.min(window.innerHeight - pop.offsetHeight - 10, e.clientY + 18);
  pop.style.left = x + "px"; pop.style.top = y + "px";
});
for (const id of ["tint", "tintmode", "conf"]) $(id).addEventListener("input", () => { $("confv").textContent = confThr().toFixed(2); render(); });
poll();
</script>
</body>
</html>
