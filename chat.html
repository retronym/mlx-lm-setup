<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local MLX Chat</title>
<style>
  :root {
    --bg: #fafaf9; --panel: #fff; --ink: #1c1917; --muted: #78716c; --line: #e7e5e4;
    --user: #e7e5e4; --accent: #c2410c; --code-bg: #1c1917; --code-ink: #f5f5f4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151413; --panel: #1c1a19; --ink: #f5f5f4; --muted: #a8a29e; --line: #2e2b29;
            --user: #2e2b29; --accent: #fb923c; --code-bg: #0c0a09; --code-ink: #f5f5f4; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, sans-serif;
         display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 650; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.ok { background: #16a34a; } .dot.bad { background: #dc2626; }
  label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  input, select, textarea, button { font: inherit; color: inherit; background: var(--bg);
        border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  input[type=number] { width: 70px; }
  #endpoint { width: 200px; } #model { max-width: 280px; }
  button { cursor: pointer; } button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  details#adv { padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  details#adv summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  #sys { width: 100%; min-height: 56px; margin-top: 8px; resize: vertical; }
  .adv-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { padding: 10px 14px; border-radius: 10px; overflow-wrap: anywhere; }
  .msg.user { background: var(--user); align-self: flex-end; max-width: 85%; white-space: pre-wrap; }
  .msg.assistant { background: var(--panel); border: 1px solid var(--line); }
  .msg.error { border-color: #dc2626; color: #dc2626; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .msg p { margin: 0 0 .6em; white-space: pre-wrap; } .msg p:last-child { margin-bottom: 0; }
  code.i { background: var(--user); padding: 1px 5px; border-radius: 4px; font: 13px ui-monospace, Menlo, monospace; }
  .code { position: relative; margin: .5em 0; }
  .code pre { margin: 0; background: var(--code-bg); color: var(--code-ink); padding: 12px; border-radius: 8px;
              overflow-x: auto; font: 13px/1.5 ui-monospace, Menlo, monospace; }
  .code .lang { position: absolute; top: 4px; left: 10px; font-size: 10px; color: #a8a29e; }
  .code .pre-wrap { padding-top: 14px; }
  .code button { position: absolute; top: 4px; right: 6px; font-size: 11px; padding: 1px 6px;
                 background: transparent; color: #d6d3d1; border-color: #44403c; }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  #input { flex: 1; resize: none; min-height: 44px; max-height: 220px; padding: 10px; }
  .empty { color: var(--muted); text-align: center; margin-top: 12vh; }
</style>
</head>
<body>
<header>
  <h1>Local MLX Chat</h1>
  <span class="dot" id="dot" title="server status"></span>
  <label>endpoint <input id="endpoint" value="http://127.0.0.1:8080" spellcheck="false"></label>
  <label>model <select id="model"></select></label>
  <label><input id="custom" placeholder="or type model id" spellcheck="false"></label>
  <button id="refresh" title="reload model list">↻</button>
  <span style="flex:1"></span>
  <button id="clear">New chat</button>
</header>

<details id="adv">
  <summary>System prompt &amp; sampling</summary>
  <textarea id="sys" placeholder="System prompt (optional)"></textarea>
  <div class="adv-row">
    <label>temperature <input id="temp" type="number" step="0.1" min="0" max="2" value="0.7"></label>
    <label>top_p <input id="topp" type="number" step="0.05" min="0" max="1" value="1"></label>
    <label>max tokens <input id="maxtok" type="number" step="256" min="16" value="2048"></label>
  </div>
</details>

<main id="scroll"><div class="wrap" id="log"><div class="empty" id="empty">Ask the local model something.<br><small>Enter to send · Shift+Enter for newline</small></div></div></main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Message…"></textarea>
    <button id="send" class="primary">Send</button>
  </div>
</footer>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
for (const [id, def] of [["endpoint", "http://127.0.0.1:8080"], ["sys", ""], ["temp", "0.7"], ["topp", "1"], ["maxtok", "2048"], ["custom", ""]]) {
  $(id).value = store.get("mlxchat." + id, def);
  $(id).addEventListener("change", () => store.set("mlxchat." + id, $(id).value));
}

let history = [];
let controller = null;

const base = () => $("endpoint").value.replace(/\/+$/, "");
const activeModel = () => $("custom").value.trim() || $("model").value;

async function loadModels() {
  try {
    const r = await fetch(base() + "/v1/models");
    const j = await r.json();
    const ids = (j.data || []).map(m => m.id);
    $("model").innerHTML = ids.map(i => `<option>${esc(i)}</option>`).join("") || "<option value=''>(none)</option>";
    const saved = store.get("mlxchat.model", "");
    if (ids.includes(saved)) $("model").value = saved;
    $("dot").className = "dot ok";
  } catch {
    $("dot").className = "dot bad";
    $("model").innerHTML = "<option value=''>(server unreachable)</option>";
  }
}
$("model").addEventListener("change", () => store.set("mlxchat.model", $("model").value));
$("endpoint").addEventListener("change", loadModels);
$("refresh").addEventListener("click", loadModels);

function esc(s) { return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// Minimal markdown: fenced code, inline code. Everything else is escaped text.
function render(text) {
  const parts = text.split(/```/);
  return parts.map((seg, i) => {
    if (i % 2 === 0) {
      return seg.split(/\n{2,}/).filter(p => p.trim()).map(p =>
        `<p>${esc(p).replace(/`([^`\n]+)`/g, '<code class="i">$1</code>')}</p>`).join("");
    }
    const nl = seg.indexOf("\n");
    const lang = nl >= 0 ? seg.slice(0, nl).trim() : "";
    const code = nl >= 0 ? seg.slice(nl + 1) : seg;
    return `<div class="code"><span class="lang">${esc(lang)}</span><button data-copy>copy</button>` +
           `<div class="pre-wrap"><pre>${esc(code.replace(/\n$/, ""))}</pre></div></div>`;
  }).join("");
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  navigator.clipboard.writeText(b.parentElement.querySelector("pre").textContent);
  b.textContent = "copied"; setTimeout(() => b.textContent = "copy", 1200);
});

function addMsg(role, html, cls = "") {
  $("empty")?.remove();
  const d = document.createElement("div");
  d.className = `msg ${role} ${cls}`;
  d.innerHTML = html;
  $("log").appendChild(d);
  $("scroll").scrollTop = $("scroll").scrollHeight;
  return d;
}

async function send() {
  if (controller) { controller.abort(); return; }
  const text = $("input").value.trim();
  const model = activeModel();
  if (!text) return;
  $("input").value = ""; autosize();
  history.push({ role: "user", content: text });
  addMsg("user", esc(text));

  const el = addMsg("assistant", "<p>…</p>");
  const messages = [...($("sys").value.trim() ? [{ role: "system", content: $("sys").value.trim() }] : []), ...history];
  controller = new AbortController();
  $("send").textContent = "Stop";

  const t0 = performance.now();
  let tFirst = null, out = "", chunks = 0, usage = null;
  try {
    const r = await fetch(base() + "/v1/chat/completions", {
      method: "POST", signal: controller.signal,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model, messages, stream: true,
        temperature: parseFloat($("temp").value), top_p: parseFloat($("topp").value),
        max_tokens: parseInt($("maxtok").value, 10),
        stream_options: { include_usage: true },
      }),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${(await r.text()).slice(0, 300)}`);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") continue;
        let j; try { j = JSON.parse(data); } catch { continue; }
        if (j.usage) usage = j.usage;
        const delta = j.choices?.[0]?.delta?.content;
        if (delta) {
          if (tFirst === null) tFirst = performance.now();
          out += delta; chunks++;
          el.innerHTML = render(out);
          $("scroll").scrollTop = $("scroll").scrollHeight;
        }
      }
    }
    history.push({ role: "assistant", content: out });
    const t1 = performance.now();
    const ntok = usage?.completion_tokens ?? chunks;
    const genS = tFirst ? (t1 - tFirst) / 1000 : 0;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${model.split("/").pop()} · ${ntok} tok` +
      (genS > 0.05 ? ` · ${(ntok / genS).toFixed(0)} tok/s` : "") +
      (tFirst ? ` · first token ${((tFirst - t0) / 1000).toFixed(2)}s` : "") +
      (usage?.prompt_tokens ? ` · prompt ${usage.prompt_tokens} tok` : "");
    el.appendChild(meta);
  } catch (e) {
    if (e.name === "AbortError") {
      if (out) history.push({ role: "assistant", content: out });
      el.insertAdjacentHTML("beforeend", `<div class="meta">stopped</div>`);
    } else {
      el.classList.add("error");
      el.innerHTML = `<p>${esc(String(e.message || e))}</p><div class="meta">Is <code class="i">./serve.sh</code> running on ${esc(base())}?</div>`;
      history.pop();
      $("dot").className = "dot bad";
    }
  } finally {
    controller = null; $("send").textContent = "Send";
  }
}

function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 220) + "px"; }
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$("send").addEventListener("click", send);
$("clear").addEventListener("click", () => {
  controller?.abort(); history = [];
  $("log").innerHTML = `<div class="empty" id="empty">New chat.</div>`;
});

loadModels();
</script>
</body>
</html>
