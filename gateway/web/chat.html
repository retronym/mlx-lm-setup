<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Models · Chat</title>
<style>
  :root {
    --bg: #fafaf9; --panel: #fff; --ink: #1c1917; --muted: #78716c; --line: #e7e5e4;
    --user: #e7e5e4; --accent: #c2410c; --code-bg: #1c1917; --code-ink: #f5f5f4; --good: #16a34a; --bad: #dc2626; --warn: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151413; --panel: #1c1a19; --ink: #f5f5f4; --muted: #a8a29e; --line: #2e2b29;
            --user: #2e2b29; --accent: #fb923c; --code-bg: #0c0a09; --code-ink: #f5f5f4; --good: #4ade80; --bad: #f87171; --warn: #fbbf24; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 650; }
  header nav { margin-left: auto; display: flex; gap: 12px; white-space: nowrap; }
  header a { color: var(--muted); font-size: 12px; text-decoration: none; } header a:hover { color: var(--ink); }
  label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  input, select, textarea, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  input[type=number] { width: 72px; }
  #model { max-width: 260px; text-overflow: ellipsis; } #voice { max-width: 170px; text-overflow: ellipsis; }
  .minfo { max-width: 820px; margin: 10px auto 0; padding: 0 16px; }
  .mcard { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; font-size: 13px; }
  .mcard > summary { cursor: pointer; padding: 8px 14px; list-style: none; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .mcard > summary::-webkit-details-marker { display: none; }
  .mcard > summary::before { content: "▸"; color: var(--muted); }
  .mcard[open] > summary::before { content: "▾"; }
  .mcard .msum { color: var(--muted); }
  #minfobody { padding: 0 14px 10px; }
  .badge { font-size: 11px; padding: 0 7px; border-radius: 9px; border: 1px solid var(--line); color: var(--muted); }
  .badge.profile { border-color: var(--accent); color: var(--accent); }
  .mdesc { margin: 0 0 10px; line-height: 1.5; }
  .mgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px 22px; margin: 0; }
  .mgrid dt { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 1px; }
  .mgrid dd { margin: 0; }
  .mgrid small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
  .mchips span { display: inline-block; font: 12px ui-monospace, Menlo, monospace; padding: 0 7px; margin: 0 5px 3px 0; border-radius: 9px; background: var(--user); }
  button { cursor: pointer; } button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .chip { font-size: 12px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .chip.ready { color: var(--good); border-color: var(--good); } .chip.starting { color: var(--warn); border-color: var(--warn); }
  details#adv { padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  details#adv summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  #sys { width: 100%; min-height: 56px; margin-top: 8px; resize: vertical; }
  .adv-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { padding: 10px 14px; border-radius: 10px; overflow-wrap: anywhere; }
  .msg.user { background: var(--user); align-self: flex-end; max-width: 85%; white-space: pre-wrap; }
  .msg.assistant { background: var(--panel); border: 1px solid var(--line); }
  .msg.error { border-color: var(--bad); color: var(--bad); }
  .meta { font-size: 11px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .meta button.speak { font-size: 11px; padding: 0 7px; margin-left: 8px; background: transparent; color: var(--muted); border-radius: 10px; }
  .meta button.speak:hover { color: var(--ink); }
  .wait { color: var(--warn); font-size: 13px; }
  details.think { margin-bottom: 8px; border-left: 2px solid var(--line); padding-left: 10px; color: var(--muted); font-size: 13px; }
  details.think summary { cursor: pointer; font-size: 12px; user-select: none; }
  details.think .tbody { margin-top: 4px; max-height: 40vh; overflow-y: auto; }
  .msg p { margin: 0 0 .6em; } .msg p:last-child { margin-bottom: 0; } .msg.assistant p.raw { white-space: pre-wrap; }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3, .md h4 { margin: 1em 0 .4em; line-height: 1.25; } .md h1 { font-size: 1.35em; } .md h2 { font-size: 1.2em; } .md h3, .md h4 { font-size: 1.05em; }
  .md ul, .md ol { margin: 0 0 .6em; padding-left: 1.5em; } .md li { margin: .15em 0; } .md li > p { margin: 0; }
  .md blockquote { margin: .6em 0; padding: 0 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
  .md a { color: var(--accent); }
  .md img { max-width: 100%; }
  .md table { border-collapse: collapse; margin: .6em 0; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 10px; } .md th { background: var(--user); text-align: left; }
  .md :not(pre) > code { background: var(--user); padding: 1px 5px; border-radius: 4px; font: 13px ui-monospace, Menlo, monospace; }
  .md pre code { font: inherit; background: none; padding: 0; }
  code.i { background: var(--user); padding: 1px 5px; border-radius: 4px; font: 13px ui-monospace, Menlo, monospace; }
  .code { position: relative; margin: .5em 0; }
  .code pre { margin: 0; background: var(--code-bg); color: var(--code-ink); padding: 12px; border-radius: 8px; overflow-x: auto; font: 13px/1.5 ui-monospace, Menlo, monospace; }
  .code .lang { position: absolute; top: 4px; left: 10px; font-size: 10px; color: #a8a29e; }
  .code .pre-wrap { padding-top: 14px; }
  .code button { position: absolute; top: 4px; right: 6px; font-size: 11px; padding: 1px 6px; background: transparent; color: #d6d3d1; border-color: #44403c; }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  #input { flex: 1; resize: none; min-height: 44px; max-height: 220px; padding: 10px; }
  .empty { color: var(--muted); text-align: center; margin-top: 12vh; }
  .samples { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 18px; }
  .samples button { font-size: 12px; padding: 2px 10px; border-radius: 12px; background: transparent; color: var(--muted); }
  .samples button:hover { color: var(--ink); }
</style>
</head>
<body>
<header>
  <h1>Local Models</h1>
  <label>model <select id="model"></select></label>
  <span class="chip" id="state">…</span>
  <label id="voicebox" hidden>voice <select id="voice"></select></label>
  <button id="clear">New chat</button>
  <nav>
    <a href="/">Home</a>
    <a href="/jev">Decide</a>
    <a href="/speech">Speech</a>
<a href="/image">Image</a>
    <a href="/vision">Vision</a>
    <a href="/translate">Translate</a>
    <a href="/search">Search</a>
    <a href="/admin" target="_blank" rel="noopener">Admin ↗</a>
  </nav>
</header>
<div class="minfo"><details class="mcard" id="modelinfo" open><summary id="minfosum">Model details</summary><div id="minfobody"></div></details></div>

<details id="adv">
  <summary>System prompt &amp; sampling</summary>
  <textarea id="sys" placeholder="System prompt (optional)"></textarea>
  <div class="adv-row">
    <label>temperature <input id="temp" type="number" step="0.1" min="0" max="2" value="0.7"></label>
    <label>top_p <input id="topp" type="number" step="0.05" min="0" max="1" value="1"></label>
    <label>max tokens <input id="maxtok" type="number" step="256" min="16" value="2048"></label>
  </div>
</details>

<main id="scroll"><div class="wrap" id="log"><div class="empty" id="empty">Ask a local model something.<br><small>The model starts on first use and stops when idle. Enter to send · Shift+Enter for a newline.</small><div class="samples"></div></div></div></main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Message…"></textarea>
    <button id="send" class="primary">Send</button>
  </div>
</footer>

<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
for (const [id, def] of [["sys", ""], ["temp", "0.7"], ["topp", "1"], ["maxtok", "2048"]]) {
  $(id).value = store.get("gwchat." + id, def);
  $(id).addEventListener("change", () => store.set("gwchat." + id, $(id).value));
}

let history = [], controller = null, models = [];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const current = () => models.find(m => m.id === $("model").value);

const DOT = { ready: "●", starting: "◐", passivating: "◌", stopped: "○", failed: "✕" };
const gb = x => x == null ? "?" : (Math.abs(x - Math.round(x)) < 0.05 ? String(Math.round(x)) : x.toFixed(1)) + " GB";
const tok = n => n == null ? "?" : n >= 1048576 ? Math.round(n / 1048576) + "M" : n >= 1024 ? Math.round(n / 1024) + "K" : String(n);
const dur = s => s == null ? "" : s < 90 ? Math.round(s) + " s" : Math.round(s / 60) + " min";

function labelBits(m) {                                   // the facts shown in the dropdown line and the card summary
  const bits = [];
  if (m.type === "profile") bits.push("on " + m.backend);
  else if (m.memory && m.memory.est_gb != null) bits.push("≈" + gb(m.memory.est_gb));
  if (m.thinking) bits.push("thinking " + m.thinking);
  if (m.defaults && m.defaults.max_tokens) bits.push("≤" + m.defaults.max_tokens + " tokens");
  return bits;
}
// The option shows only the id (the details card below has the rest); the summary goes in the tooltip so long ids and specs do not widen the header.
const optionLabel = m => `${DOT[m.state] || "○"} ${m.id}`;
const optionTip = m => [m.id, ...labelBits(m)].join(" · ");

async function loadModels() {
  let list;
  try {
    try { list = (await (await fetch("/api/models", { cache: "no-store" })).json()).models; }       // rich details
    catch { list = (await (await fetch("/v1/models", { cache: "no-store" })).json()).data; }       // older gateway: ids and state only
    if (!Array.isArray(list)) throw new Error("bad model list");
  } catch { $("state").textContent = "gateway unreachable"; $("state").className = "chip"; return; }
  models = list;
  const sel = $("model"), keep = sel.value || store.get("gwchat.model", "");
  const opt = m => `<option value="${esc(m.id)}" title="${esc(optionTip(m))}">${esc(optionLabel(m))}</option>`;
  const bs = models.filter(m => m.type !== "profile"), ps = models.filter(m => m.type === "profile");
  sel.innerHTML = ps.length
    ? `<optgroup label="Models (each is its own process)">${bs.map(opt).join("")}</optgroup><optgroup label="Profiles (same process, different defaults)">${ps.map(opt).join("")}</optgroup>`
    : bs.map(opt).join("");
  if (models.some(m => m.id === keep)) sel.value = keep;
  showState();
}

const row = (label, html) => html ? `<div><dt>${label}</dt><dd>${html}</dd></div>` : "";
function renderInfo(m) {
  const isProfile = m.type === "profile", mem = m.memory || {}, disk = m.disk || null, def = m.defaults || {};
  $("minfosum").innerHTML = `${DOT[m.state] || "○"} <b>${esc(m.id)}</b> <span class="badge ${isProfile ? "profile" : ""}">${isProfile ? "profile" : "model"}</span> <span class="msum">${esc(labelBits(m).join(" · "))}</span>`;
  if (m.memory === undefined && !m.description) { $("minfobody").innerHTML = ""; return; }      // lean fallback list: nothing more to say
  const life = m.state === "ready"
    ? `running${m.busy ? " (busy)" : ""} · idle ${dur(m.idle_s)}` + (m.pinned ? " · pinned, never unloaded" : m.ttl_left_s != null && m.ttl_s ? " · unloads in " + dur(m.ttl_left_s) : "")
    : m.state === "stopped"
      ? "stopped · loads on your first message" + (m.last_start_s ? ` (last load ${m.last_start_s.toFixed(1)} s)` : "") + (m.ttl_s ? `, unloads after ${dur(m.ttl_s)} idle` : "")
      : String(m.state);
  let memHtml = "";
  if (isProfile) memHtml = `none extra: runs on <b>${esc(m.backend)}</b> (shared process)`;
  else if (mem.weights_gb != null) memHtml = `<b>≈ ${gb(mem.est_gb)}</b> while loaded<small>weights ${gb(mem.weights_gb)} + KV cache ${gb(mem.kv_gb)} (sized for ${tok(mem.context_tokens)} tokens) + overhead ${gb(mem.overhead_gb)}</small>`;
  else if (mem.est_gb != null) memHtml = `<b>≈ ${gb(mem.est_gb)}</b> while loaded<small>a catalog estimate</small>`;
  let ctxHtml = "";
  if (disk && disk.kv_kib_per_token) {
    const at = n => gb(disk.kv_kib_per_token * 1024 * n / 1e9);          // decimal GB, matching the model guide
    ctxHtml = (disk.max_context ? `up to <b>${tok(disk.max_context)}</b> tokens` : "context limit unknown")
      + `<small>KV cache grows ${disk.kv_kib_per_token} KiB per token: ${at(32768)} at 32K, ${at(131072)} at 128K</small>`;
  } else if (disk && disk.max_context) ctxHtml = `up to <b>${tok(disk.max_context)}</b> tokens`;
  const think = m.thinking === "on" ? "<b>on</b><small>reasons first, then answers: slower and more tokens, so it is capped</small>"
    : m.thinking === "off" ? "<b>off</b> by default<small>a request can turn it on with chat_template_kwargs.enable_thinking</small>"
    : "the model's own default<small>not set by the gateway</small>";
  const chips = Object.entries(def).map(([k, v]) => `${k} = ${typeof v === "object" ? JSON.stringify(v) : v}`);
  if (m.system_prompt) chips.push("adds a system prompt");
  const defHtml = chips.length ? `<div class="mchips">${chips.map(c => `<span>${esc(c)}</span>`).join("")}</div><small>used only where your request does not set them: the settings below always win</small>` : "";
  const alias = (m.aliases || []).length ? `<small>also answers to: ${m.aliases.map(esc).join(", ")}</small>` : "";
  $("minfobody").innerHTML = (m.description ? `<p class="mdesc">${esc(m.description)}</p>` : "") + `<dl class="mgrid">`
    + row("Status", esc(life)) + row("Memory", memHtml) + row("Context", ctxHtml) + row("Thinking", think)
    + (disk ? row("Weights on disk", `${gb(disk.weights_gb)}${disk.model_type ? " · " + esc(disk.model_type) : ""}${disk.quant_bits ? " · " + disk.quant_bits + "-bit" : ""}`) : "")
    + (isProfile ? row("Based on", esc(m.backend)) : "") + row(isProfile ? "Defaults it applies" : "", defHtml)
    + ((m.profiles || []).length ? row("Profiles on this model", m.profiles.map(esc).join(", ")) : "")
    + row("In the API", `<code>"model": "${esc(m.id)}"</code>${alias}`) + `</dl>`;
}
function showState() {
  const m = current(); if (!m) return;
  const st = m.state;
  $("state").textContent = st;                                                                    // the details card says what "stopped" means
  $("state").title = st === "stopped" ? "starts on first message" : "";
  $("state").className = "chip " + (st === "ready" ? "ready" : st === "starting" ? "starting" : "");
  renderInfo(m);
}
$("model").addEventListener("change", () => { store.set("gwchat.model", $("model").value); showState(); });
$("modelinfo").open = store.get("gwchat.info", "1") === "1";                                       // remember whether the card is open
$("modelinfo").addEventListener("toggle", () => store.set("gwchat.info", $("modelinfo").open ? "1" : "0"));

function renderPlain(text) {   // fallback when the markdown libs failed to load (vendor scripts failed to load)
  return text.split(/```/).map((seg, i) => {
    if (i % 2 === 0) {
      return seg.split(/\n{2,}/).filter(p => p.trim()).map(p => `<p class="raw">${esc(p).replace(/`([^`\n]+)`/g, '<code class="i">$1</code>')}</p>`).join("");
    }
    const nl = seg.indexOf("\n");
    const lang = nl >= 0 ? seg.slice(0, nl).trim() : "", code = nl >= 0 ? seg.slice(nl + 1) : seg;
    return codeBlock(lang, code.replace(/\n$/, ""));
  }).join("");
}
const codeBlock = (lang, code) => `<div class="code"><span class="lang">${esc(lang)}</span><button data-copy>copy</button><div class="pre-wrap"><pre>${esc(code)}</pre></div></div>`;
function render(text) {
  if (!window.marked || !window.DOMPurify) return renderPlain(text);
  const html = DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: true }), { ADD_ATTR: ["target"] });
  const t = document.createElement("template"); t.innerHTML = html;
  t.content.querySelectorAll("pre").forEach(pre => {
    const code = pre.querySelector("code"), lang = (code?.className.match(/language-(\S+)/) || [])[1] || "";
    const w = document.createElement("div"); w.innerHTML = codeBlock(lang, pre.textContent.replace(/\n$/, "")); pre.replaceWith(w.firstChild);
  });
  t.content.querySelectorAll("a[href]").forEach(a => { a.target = "_blank"; a.rel = "noopener noreferrer"; });
  const d = document.createElement("div"); d.className = "md"; d.appendChild(t.content);
  return d.outerHTML;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  navigator.clipboard.writeText(b.parentElement.querySelector("pre").textContent);
  b.textContent = "copied"; setTimeout(() => b.textContent = "copy", 1200);
});
function thinkUpdate(el, text, streaming) {                // reasoning is a persistent <details> updated in place so toggling and scrolling survive streaming; it collapses once the answer starts unless the user toggled it
  let d = el.querySelector("details.think");
  if (!d) {
    if (!text) return;
    el.textContent = "";
    d = document.createElement("details"); d.className = "think"; d.open = true;
    d.innerHTML = `<summary></summary><div class="tbody"></div>`;
    d.addEventListener("toggle", () => { if (!d._auto) d._user = true; });
    el.appendChild(d); el.appendChild(Object.assign(document.createElement("div"), { className: "ans" }));
  }
  if (!streaming && !d._user && d.open) { d._auto = true; d.open = false; setTimeout(() => d._auto = false); }
  d.querySelector("summary").textContent = `${streaming ? "Thinking…" : "Thought"} (${text.length} chars)`;
  const b = d.querySelector(".tbody"), top = b.scrollTop;
  if (!d._follow) d._follow = pinLatch(b);
  if (d._text !== text) {
    const lines = text.split("\n").length, newLine = lines !== d._lines; d._text = text; d._lines = lines;
    b.innerHTML = render(text);                                   // replacing content clamps scrollTop, so restore it
    b.scrollTop = d._follow.on && newLine ? b.scrollHeight : top;  // only follow the tail when a new line has started, not on every token
  }
  return d;
}
function addMsg(role, html, cls = "") {
  $("empty")?.remove();
  const d = document.createElement("div"); d.className = `msg ${role} ${cls}`; d.innerHTML = html;
  const stick = role === "user" || atBottom(); $("log").appendChild(d); if (stick) toBottom(); return d;
}

async function send() {
  if (controller) { controller.abort(); return; }
  const text = $("input").value.trim(), model = $("model").value;
  if (!text || !model) return;
  $("input").value = ""; autosize();
  history.push({ role: "user", content: text });
  addMsg("user", esc(text));
  const el = addMsg("assistant", "");
  const messages = [...($("sys").value.trim() ? [{ role: "system", content: $("sys").value.trim() }] : []), ...history];
  controller = new AbortController(); $("send").textContent = "Stop";

  const cold = current()?.state !== "ready";
  const t0 = performance.now();
  const ticker = setInterval(() => {                       // headers only arrive once the model is up, so this is the load time
    if (!out && !reasoning) el.innerHTML = `<p class="wait">${cold ? "Starting " + esc(model) + " (first message after idle)" : "Thinking"}… ${((performance.now() - t0) / 1000).toFixed(0)}s</p>`;
  }, 250);
  let tFirst = null, out = "", reasoning = "", chunks = 0, usage = null, coldSecs = null;
  let raf = 0, renderedOut = -1, lastLines = 0;
  const paint = () => {                                    // coalesce chunks into one DOM update per frame
    raf = 0; const stick = atBottom(), lines = (reasoning + out).split("\n").length;
    if (reasoning) { thinkUpdate(el, reasoning, !out); if (out.length !== renderedOut) el.querySelector(".ans").innerHTML = out ? render(out) : ""; }
    else if (out.length !== renderedOut) el.innerHTML = render(out);
    renderedOut = out.length;
    if (stick && lines !== lastLines) toBottom();            // follow once per new line of output, not per token
    lastLines = lines;
  };
  try {
    const r = await fetch("/v1/chat/completions", {
      method: "POST", signal: controller.signal, headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model, messages, stream: true, temperature: parseFloat($("temp").value), top_p: parseFloat($("topp").value),
                             max_tokens: parseInt($("maxtok").value, 10), stream_options: { include_usage: true } }),
    });
    coldSecs = r.headers.get("x-gateway-cold-start-secs");
    if (!r.ok) {
      let msg = `HTTP ${r.status}`;
      try { const j = await r.json(); msg = (j.error?.message || msg) + (j.error?.type ? `  [${j.error.type}]` : ""); } catch {}
      const ra = r.headers.get("retry-after");
      throw new Error(msg + (ra ? `  (try again in ${ra}s)` : ""));
    }
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim(); if (data === "[DONE]") continue;
        let j; try { j = JSON.parse(data); } catch { continue; }
        if (j.usage) usage = j.usage;
        const d = j.choices?.[0]?.delta || {};
        if (d.reasoning || d.content) {
          if (tFirst === null) tFirst = performance.now();
          reasoning += d.reasoning || ""; out += d.content || ""; chunks++;
          if (!raf) raf = requestAnimationFrame(paint);
        }
      }
    }
    cancelAnimationFrame(raf); paint();
    history.push({ role: "assistant", content: out });
    const t1 = performance.now(), ntok = usage?.completion_tokens ?? chunks, genS = tFirst ? (t1 - tFirst) / 1000 : 0;
    const meta = document.createElement("div"); meta.className = "meta";
    meta.textContent = `${model} · ${ntok} tok` + (genS > 0.05 ? ` · ${(ntok / genS).toFixed(0)} tok/s` : "") +
      (tFirst ? ` · first token ${((tFirst - t0) / 1000).toFixed(2)}s` : "") + (coldSecs ? ` · cold start ${coldSecs}s` : "") +
      (usage?.prompt_tokens ? ` · prompt ${usage.prompt_tokens} tok` : "");
    if (voices.length && out) meta.appendChild(Object.assign(document.createElement("button"), { className: "speak", textContent: "▶ speak", title: "Read this aloud with the selected local voice" }));
    el.appendChild(meta);
  } catch (e) {
    if (e.name === "AbortError") { cancelAnimationFrame(raf); paint(); if (out) history.push({ role: "assistant", content: out }); el.insertAdjacentHTML("beforeend", `<div class="meta">stopped</div>`); }
    else { el.classList.add("error"); el.innerHTML = `<p>${esc(String(e.message || e))}</p>`; history.pop(); }
  } finally {
    cancelAnimationFrame(raf); clearInterval(ticker); controller = null; $("send").textContent = "Send"; loadModels();
  }
}

// ---- read aloud: the selected local voice via /v1/audio/speech (the speech model starts on first use) ----
let voices = [], player = null, playingBtn = null;
async function loadVoices() {
  try {
    const j = await (await fetch("/api/voices")).json();
    voices = [];
    for (const m of j.models) {
      if (m.voices.length) for (const v of m.voices) voices.push({ model: m.model, label: `${m.model} · ${v}`, body: { voice: v }, first: v === m.default_voice });
      if (m.default_ref) for (const c of m.reference_clips) voices.push({ model: m.model, label: `${m.model} · ${c}`, body: { ref_audio: c }, first: false });
    }
    const sel = $("voice"); sel.innerHTML = voices.map((v, i) => `<option value="${i}">${esc(v.label)}</option>`).join("");
    const def = voices.findIndex(v => v.first); if (def >= 0) sel.value = String(def);
    try { const saved = localStorage.getItem("voice"); if (saved) { const i = voices.findIndex(v => v.label === saved); if (i >= 0) sel.value = String(i); } } catch {}
    $("voicebox").hidden = !voices.length;
  } catch {}
}
$("voice").addEventListener("change", () => { try { localStorage.setItem("voice", voices[$("voice").value]?.label || ""); } catch {} });
function plainText(msg) {                                   // what a person would read: no reasoning, code blocks or meta line
  const c = msg.cloneNode(true); c.querySelectorAll("details.think, .code, .meta, pre").forEach(n => n.remove());
  document.body.appendChild(c); c.style.cssText = "position:absolute;left:-9999px;width:600px"; const t = c.innerText; c.remove();   // innerText needs layout to keep paragraph breaks
  return t.replace(/\n{3,}/g, "\n\n").trim();
}
document.addEventListener("click", async e => {
  const b = e.target.closest("button.speak"); if (!b) return;
  if (player) { player.pause(); player = null; if (playingBtn) playingBtn.textContent = "▶ speak"; const same = playingBtn === b; playingBtn = null; if (same) return; }
  const v = voices[$("voice").value]; if (!v) return;
  const text = plainText(b.closest(".msg")); if (!text) return;
  b.textContent = "… synthesizing"; playingBtn = b;
  try {
    const r = await fetch("/v1/audio/speech", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: v.model, input: text, ...v.body }) });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error?.message || j.error || `HTTP ${r.status}`); }
    const url = URL.createObjectURL(await r.blob()); const a = new Audio(url); player = a;
    a.onended = a.onerror = () => { URL.revokeObjectURL(url); if (player === a) { player = null; playingBtn = null; } b.textContent = "▶ speak"; };
    b.textContent = "■ stop"; await a.play();
  } catch (err) { b.textContent = "▶ speak"; b.title = String(err.message || err); player = null; playingBtn = null; alert("Speech failed: " + (err.message || err)); }
});

// "following" is a latch the user controls: scrolling away from the bottom turns it off, scrolling back to the bottom turns it on.
// Content growth never changes it, so streaming can't drag the view away from where the user parked it.
const pinLatch = (el, slack = 6) => { const st = { on: true };
  el.addEventListener("scroll", () => { st.on = el.scrollHeight - el.scrollTop - el.clientHeight < slack; });
  el.addEventListener("wheel", e => { if (e.deltaY < 0) st.on = false; }, { passive: true });
  return st; };
const pageFollow = pinLatch($("scroll"));
function atBottom() { return pageFollow.on; }
function toBottom() { const s = $("scroll"); s.scrollTop = s.scrollHeight; }
function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 220) + "px"; }
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$("send").addEventListener("click", send);
const SAMPLES = [
  ["Explain", "Explain how a B-tree keeps itself balanced, with a small worked example."],
  ["Code", "Write a Python function that merges overlapping intervals, with a few tests."],
  ["Summarize", "Summarize the trade-offs between optimistic and pessimistic locking in five bullet points."],
  ["Rewrite", "Rewrite this to be clearer and shorter: “We are currently in the process of evaluating the possibility of potentially migrating our services.”"],
  ["Reason", "A bat and a ball cost $1.10 together, and the bat costs $1.00 more than the ball. What does the ball cost? Think it through."],
];
function seedSamples(box) {
  box.innerHTML = SAMPLES.map(([l, t], i) => `<button data-i="${i}" title="${esc(t)}">${esc(l)}</button>`).join("");
  box.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
    $("input").value = SAMPLES[b.dataset.i][1]; autosize(); $("input").focus(); });
}
seedSamples(document.querySelector("#empty .samples"));
$("clear").addEventListener("click", () => { controller?.abort(); history = [];
  $("log").innerHTML = `<div class="empty" id="empty">New chat.<div class="samples"></div></div>`; seedSamples(document.querySelector("#empty .samples")); });
loadModels(); setInterval(loadModels, 3000); loadVoices();
</script>
