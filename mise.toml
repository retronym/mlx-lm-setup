[tools]
python = "3.14"
uv = "latest"

[env]
UV_PYTHON = "{{config_root}}/.venv/bin/python"

[tasks.setup]
description = "Create .venv with the gateway's dependencies"
run = [
  "uv venv --allow-existing --python 3.14 .venv",
  "uv pip install -r requirements.txt",
]
sources = ["requirements.txt"]
outputs = [".venv/pyvenv.cfg"]

[tasks.setup-image]
description = "Create .venv-image (mflux) for the text-to-image backends"
run = [
  "uv venv --allow-existing --python 3.12 .venv-image",
  "uv pip install --python .venv-image/bin/python -r requirements-image.txt",
]

[tasks.test]
description = "Gateway unit tests (fake backends; no models or GPU)"
depends = ["setup"]
run = ".venv/bin/python -m unittest discover -s gateway/tests -t ."

[tasks.translate-app]
description = "Build ~/Applications/TranslateCapture.app (Screen Recording helper for the Translate shortcut)"
run = "pipelines/translate/make_capture_app.sh"

[tasks.build]
description = "Set up, test, and build the Translate capture app"
depends = ["test", "translate-app"]

[tasks.service-restart]
description = "Relaunch the gateway launchd service (kickstart -k) and show status"
run = "service/service.sh restart"

[tasks.service-install]
description = "Install/refresh the gateway launchd agent from this checkout (starts at login)"
run = "service/service.sh install"

[tasks.service-uninstall]
description = "Stop the gateway and remove the launchd agent"
run = "service/service.sh uninstall"

[tasks.service-status]
description = "Show launchd state and gateway /healthz"
run = "service/service.sh status"

[tasks.service-logs]
description = "Tail the gateway log (arg: line count, default 50)"
run = "service/service.sh logs {{arg(name='lines', default='50')}}"

[tasks.discover]
description = "List MLX models on disk (HF cache, LM Studio); pass --snippet <id> --context N --kv-bits B for a catalog entry"
depends = ["setup"]
run = ".venv/bin/python -m gateway.cli discover"

[tasks.live-check]
description = "Exercise every gateway tool against a running gateway with the real models"
depends = ["setup"]
run = ".venv/bin/python -m gateway.live_check"

[tasks.gateway]
description = "Run the gateway in the foreground on 127.0.0.1:8090 (the service tasks run it as a login service)"
depends = ["setup"]
run = ".venv/bin/python -m gateway"

[tasks.admin]
description = "Open the authenticated admin page (token travels in the URL fragment only)"
depends = ["setup"]
run = ".venv/bin/python -m gateway admin"

[tasks.token]
description = "Show the admin token"
depends = ["setup"]
run = ".venv/bin/python -m gateway token"
